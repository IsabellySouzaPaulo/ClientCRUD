# Conexão com o banco H2 (em memória: os dados somem quando a aplicação para)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria as tabelas ao subir e executa o import.sql (seed dos 12 clientes)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# Mostra no console os SQLs executados
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
